name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Pint, Larastan, tests (MySQL 8 + Redis)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: trading_test
          MYSQL_USER: trading
          MYSQL_PASSWORD: secret
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psecret"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: trading_test
      # root, because creating the ledger's append-only TRIGGERs needs it when binary logging is on
      DB_USERNAME: root
      DB_PASSWORD: secret
      REDIS_HOST: 127.0.0.1

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, redis, pcntl, intl, zip
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Laravel Pint (code style)
        run: vendor/bin/pint --test

      - name: Larastan (static analysis, level 6)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Unit and feature tests
        run: php artisan test --testsuite=Unit,Feature

      - name: Concurrency tests (real parallel processes)
        run: php artisan test --testsuite=Concurrency
